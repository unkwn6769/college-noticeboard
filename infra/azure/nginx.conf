# This file mirrors the site configuration that is actually installed on the VM.
# The TLS certificate paths are the Let's Encrypt ones Certbot creates for the
# public host; Certbot manages those files and rewrites this file when a
# certificate is issued or renewed, so re-check it after any `certbot` run.
#
# The application listens on 127.0.0.1:3000 and is never exposed directly.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 512m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads are streamed; buffering them would defeat the upload protocol.
        proxy_request_buffering off;
    }
}

server {
    server_name college-noticeboard.duckdns.org; # managed by Certbot
    client_max_body_size 512m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/college-noticeboard.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/college-noticeboard.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # The application sets nosniff, frame, referrer and permissions policy itself
    # in next.config.mjs, so those also apply when it is reached directly. HSTS
    # belongs to whichever edge terminates TLS, so it is set here instead. It is
    # only ever sent over HTTPS, so enabling it cannot lock out a client that has
    # no HTTPS route at all.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
