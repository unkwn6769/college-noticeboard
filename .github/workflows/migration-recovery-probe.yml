name: Migration Recovery Probe

on:
  workflow_dispatch:
    inputs:
      migration_id:
        description: "Migration ID to inspect"
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Read-only recovery probe
        run: node scripts/verify-migration-recovery.js "${{ inputs.migration_id }}"
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          GOOGLE_DRIVE_HTTP2: "true"

      - name: Inspect migration execution history
        run: |
          node --input-type=module <<'EOF'
          import { pool } from "./server/db/database.js";

          const migrationId = process.env.MIGRATION_ID;

          const migration = await pool.query(`
            SELECT
              id,
              status,
              cancel_requested,
              total_files,
              completed_files,
              failed_files,
              started_at,
              finished_at,
              updated_at
            FROM google_drive_account_migrations
            WHERE id = $1
          `, [migrationId]);

          const runs = await pool.query(`
            SELECT
              id,
              runner_id,
              status,
              worker_count,
              started_at,
              finished_at,
              heartbeat_at,
              last_error,
              metadata
            FROM migration_execution_runs
            WHERE migration_id = $1
            ORDER BY started_at DESC
            LIMIT 20
          `, [migrationId]);

          console.log(JSON.stringify({
            migration: migration.rows,
            execution_runs: runs.rows
          }, null, 2));

          await pool.end();
          EOF
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          MIGRATION_ID: ${{ inputs.migration_id }}

      - name: Inspect item transition timestamps
        run: |
          node --input-type=module <<'EOF'
          import { pool } from "./server/db/database.js";

          const migrationId = process.env.MIGRATION_ID;

          const result = await pool.query(`
            SELECT
              id,
              status,
              transfer_phase,
              target_file_id,
              target_recovery_required,
              source_delete_status,
              created_at,
              started_at,
              finished_at,
              updated_at,
              lease_expires_at,
              error_message
            FROM google_drive_account_migration_items
            WHERE migration_id = $1
            ORDER BY updated_at DESC, id
          `, [migrationId]);

          console.log(JSON.stringify(result.rows, null, 2));

          await pool.end();
          EOF
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          MIGRATION_ID: ${{ inputs.migration_id }}

      - name: Read-only migration state check
        run: |
          node --input-type=module <<'EOF'
          import { pool } from "./server/db/database.js";

          const migrationId = process.env.MIGRATION_ID;

          const migration = await pool.query(`
            SELECT
              status,
              total_files,
              completed_files,
              failed_files
            FROM google_drive_account_migrations
            WHERE id = $1
          `, [migrationId]);

          const counts = await pool.query(`
            SELECT
              status,
              transfer_phase,
              COUNT(*)::int AS count
            FROM google_drive_account_migration_items
            WHERE migration_id = $1
            GROUP BY status, transfer_phase
            ORDER BY status, transfer_phase
          `, [migrationId]);

          const item = await pool.query(`
            SELECT
              id,
              source_file_id,
              target_file_id,
              status,
              transfer_phase,
              source_delete_status,
              target_recovery_required,
              lease_expires_at,
              error_message
            FROM google_drive_account_migration_items
            WHERE migration_id = $1
              AND target_file_id = '1wqA-kNuhWQiFKrDv2TGHOddix_VV96CZ'
          `, [migrationId]);

          console.log(JSON.stringify({
            migration: migration.rows,
            counts: counts.rows,
            tested_item: item.rows
          }, null, 2));

          await pool.end();
          EOF
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          MIGRATION_ID: ${{ inputs.migration_id }}
